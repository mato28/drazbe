# Staging / client test environment on the VPS, behind an existing Traefik.
#
#   cp .env.staging.example .env.staging   # fill in secrets
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
#
# Postgres is NOT part of this stack: it runs in its own container on the VPS; we join its
# Docker network. See docs/deploy-staging.md.
name: domik-staging

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: https://${APP_HOST}
  DATABASE_URL: ${DATABASE_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  # Public URL: pre-signed download links are opened by the browser.
  S3_ENDPOINT: https://${S3_HOST}
  S3_REGION: eu-central
  S3_BUCKET: domik
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  # All mail is caught by Mailpit (nothing leaves the server).
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  MAIL_FROM: Domik (test) <no-reply@${APP_HOST}>
  DSS_URL: http://dss:8080
  SIGNATURE_REQUIRE_QUALIFIED: 'false'
  ALLOW_DEMO_DATA: 'true'
  SEED_PASSWORD: ${SEED_PASSWORD}

services:
  # One-shot: applies DB migrations; web and worker wait for it.
  migrate:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    image: domik-worker:staging
    command: ['node', 'dist/cli/migrate.js']
    environment: *app-env
    networks: [postgres]
    restart: 'no'

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: domik-web:staging
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [default, postgres, traefik]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.domik-web.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.domik-web.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.domik-web.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.domik-web.middlewares=domik-noindex
      - traefik.http.middlewares.domik-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.services.domik-web.loadbalancer.server.port=3000

  worker:
    image: domik-worker:staging
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [default, postgres]
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
      - rustfs-data:/data
    networks: [default, traefik]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000']
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.domik-s3.rule=Host(`${S3_HOST}`)
      - traefik.http.routers.domik-s3.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.domik-s3.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.domik-s3.loadbalancer.server.port=9000

  # One-shot: creates the bucket and allows browser access from the app origin (CORS).
  s3-init:
    image: amazon/aws-cli:2.40.3
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: eu-central
      APP_ORIGIN: https://${APP_HOST}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000 s3api"
        $$S3 head-bucket --bucket domik 2>/dev/null || $$S3 create-bucket --bucket domik
        printf '{"CORSRules":[{"AllowedOrigins":["%s"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}' "$$APP_ORIGIN" > /tmp/cors.json
        $$S3 put-bucket-cors --bucket domik --cors-configuration file:///tmp/cors.json
        echo "bucket ready, CORS origin $$APP_ORIGIN"
    networks: [default]
    restart: 'no'

  # Test inbox: every email the platform sends (OTP codes, notifications) lands here.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    networks: [default, traefik]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.domik-mail.rule=Host(`${MAIL_HOST}`)
      - traefik.http.routers.domik-mail.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.domik-mail.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.domik-mail.loadbalancer.server.port=8025

  # Optional: EU DSS for validating signed sale contracts (needs ~1.5 GB RAM, slow first build).
  #   docker compose --env-file .env.staging -f docker-compose.staging.yml --profile dss up -d
  dss:
    profiles: ['dss']
    build:
      context: https://github.com/esig/dss-demonstrations.git#6.5.1
    image: domik/dss-demo-webapp:6.5.1
    environment:
      JAVA_OPTS: -Xmx1g
    networks: [default]
    restart: unless-stopped

networks:
  default: {}
  postgres:
    external: true
    name: ${POSTGRES_NETWORK}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  rustfs-data:
  mailpit-data:
